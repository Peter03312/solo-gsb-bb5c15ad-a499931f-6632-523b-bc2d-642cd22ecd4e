services:
  waterworks:
    build: .
    image: waterworks-compliance:latest
    container_name: waterworks-api
    ports:
      - "8080:8080"
    environment:
      WATERWORKS_DB: /data/waterworks.db
      SEED_ON_STARTUP: "true"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
    volumes:
      - waterworks-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  waterworks-data:
